name: "Development"
on:
  push: 
    branches:
      - development

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout-code
        uses: actions/checkout@v4

      - name: setup-dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: dotnet restore
        run:  dotnet restore

      - name: clean
        run: dotnet clean

      - name: build
        run: dotnet build --configuration Debug
    
      - name: teste
        run: dotnet test --verbosity normal